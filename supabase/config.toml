# Only the settings this project relies on. The quote form is public, so the
# function does its own checks (origin, Turnstile, validation, rate limits)
# instead of requiring a Supabase JWT.
[functions.submit-quote]
verify_jwt = false

# The dashboard's patch report buttons. The function checks the caller itself:
# it calls public.is_admin() with the caller's token (allowlist plus MFA), so
# it doesn't depend on the gateway's JWT check.
[functions.report-action]
verify_jwt = false

# Outgoing quotes: the dashboard's Send now, Resend, Send me a test and
# Payments status. Like report-action, it checks the caller itself
# (public.is_admin() with the caller's token).
[functions.quote-action]
verify_jwt = false

# The dashboard's prospect audit buttons (Run audit, Re-scan, Rebuild, Send,
# Send me a copy, Cancel). Checks the caller itself (public.is_admin() with the
# caller's token), then dispatches a workflow in the audit repo.
[functions.audit-action]
verify_jwt = false

# The quote page's Accept, Request changes and Pay buttons. Public, so it does
# its own checks (origin, Turnstile, rate limits, totals) like submit-quote.
[functions.quote-public]
verify_jwt = false

# The scheduler's worker. Called by pg_cron with a key from Vault, which the
# function checks against the database; browsers are refused.
[functions.quote-cron]
verify_jwt = false

# Stripe's webhook. Stripe signs each event; the function checks the signature
# with STRIPE_WEBHOOK_SECRET before reading anything.
[functions.stripe-webhook]
verify_jwt = false
